

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | Foodie Reppy</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Same Caveat font used on the homepage -->
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Pacifico&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./signup/signup.css">
</head>

<body>

    <!-- HEADER -->
    <header class="site-header">

        <div class="header-title">
            <a href="index.html"></a>
        </div>

        <nav class="main-nav" id="mainNav">

            <a href="index.html">Home</a>

            <a href="categories.html">Categories</a>

            <a href="about.html">About</a>

            <a href="faq.html">FAQ</a>

        </nav>

        <button
            class="menu-toggle"
            id="menuToggle"
            type="button"
            aria-label="Toggle navigation"
            aria-expanded="false">
            ☰
        </button>

    </header>


    <!-- SIGNUP MAIN CONTENT -->
    <main class="page-main">

        <section class="signup-card" aria-labelledby="signupTitle">

            <div class="card-heading">

                <a class="card-brand">Foodie Reppy</a>

                <h1 id="signupTitle">Create Your Account</h1>

            </div>


            <form id="signupForm" novalidate>

                <!-- FULL NAME -->
                <div class="form-field">

                    <label for="fullName">Full Name</label>

                    <input
                        id="fullName"
                        name="fullName"
                        type="text"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required>

                    <small class="error-message" id="nameError"></small>

                </div>


                <!-- EMAIL -->
                <div class="form-field">

                    <label for="email">Email Address</label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required>

                    <small class="error-message" id="emailError"></small>

                </div>


                <!-- PASSWORD -->
                <div class="form-field">

                    <label for="password">Password</label>

                    <div class="password-wrap">

                        <input
                            id="password"
                            name="password"
                            type="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            required>

                        <button
                            class="password-toggle"
                            type="button"
                            data-toggle="password"
                            aria-label="Show password">
                            ◉
                        </button>

                    </div>

                    <small class="hint">Use at least 8 characters.</small>

                    <small class="error-message" id="passwordError"></small>

                </div>


                <!-- CONFIRM PASSWORD -->
                <div class="form-field">

                    <label for="confirmPassword">Confirm Password</label>

                    <div class="password-wrap">

                        <input
                            id="confirmPassword"
                            name="confirmPassword"
                            type="password"
                            placeholder="Re-enter your password"
                            autocomplete="new-password"
                            required>

                        <button
                            class="password-toggle"
                            type="button"
                            data-toggle="confirmPassword"
                            aria-label="Show confirm password">
                            ◉
                        </button>

                    </div>

                    <small class="error-message" id="confirmError"></small>

                </div>


                <!-- SIGNUP BUTTON -->
                <button class="primary-button" type="submit">
                    Sign Up
                </button>


                <!-- DIVIDER -->
                <div class="separator">

                    <span></span>

                    <p>or</p>

                    <span></span>

                </div>


                <!-- LOGIN LINK -->
                <a class="secondary-button" href="login.html">

                    Already have an account?

                    <strong>Log In</strong>

                </a>


                <p
                    class="form-feedback"
                    id="formFeedback"
                    role="status"
                    aria-live="polite">
                </p>

            </form>

        </section>

    </main>


    <!-- FOOTER -->
    <footer class="site-footer">

        <div class="footer-brand">

            <a class="brand" href="index.html">
                Foodie Reppy
            </a>

            <p>Discover. Cook. Enjoy.</p>

        </div>

        <small>
            © <span id="year"></span> Foodie Reppy. All Rights Reserved.
        </small>

    </footer>


    <!-- JAVASCRIPT -->
    <script type="module" src="./signup/signup.js"></script>

<script type="module" src="./firebase/auth-ui.js"></script>
</body>
</html>
